<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Slider</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="slider-container length-slider">
    <div class="slider-wrapper">
      <button class="arrow-button prev" onclick="changeImage('length', -1)">‹</button>
      <button class="arrow-button next" onclick="changeImage('length', 1)">›</button>
      <div class="main-image-container" id="length-image-container">
      </div>
    </div>
    <div class="thumbnails-container" id="length-thumbnails"></div>
  </div>
  
  <div class="slider-container width-slider">
    <div class="slider-wrapper">
      <button class="arrow-button prev" onclick="changeImage('width', -1)">‹</button>
      <button class="arrow-button next" onclick="changeImage('width', 1)">›</button>
      <div class="main-image-container" id="width-image-container">
      </div>
    </div>
    <div class="thumbnails-container" id="width-thumbnails"></div>
  </div>
  
  <script>
    const sliders = {
      width: { currentIndex: 0, images: [] },
      length: { currentIndex: 0, images: [] }
    };
    
    function createSlider(type, imageUrls) {
      if (!imageUrls || imageUrls.length === 0) {
        document.querySelector(`.${type}-slider`).innerHTML = '<div class="loading">이미지가 없습니다.</div>';
        return sendHeight();
      }
    
      sliders[type].images = imageUrls;
      sliders[type].currentIndex = 0;
    
      const imageContainer = document.getElementById(`${type}-image-container`);
      const thumbnailsContainer = document.getElementById(`${type}-thumbnails`);
      imageContainer.innerHTML = '';
      thumbnailsContainer.innerHTML = '';
    
      imageUrls.forEach((url, index) => {
        const isActive = index === 0 ? 'active' : '';
    
        const img = document.createElement('img');
        img.src = url;
        img.className = `main-image ${isActive}`;
        img.alt = `${type} image ${index + 1}`;
        imageContainer.appendChild(img);
    
        const thumbnail = document.createElement('img');
        thumbnail.src = url;
        thumbnail.className = `thumbnail ${isActive}`;
        thumbnail.alt = `${type} thumbnail ${index + 1}`;
        thumbnail.onclick = () => goToImage(type, index);
        thumbnailsContainer.appendChild(thumbnail);
      });
    
      setupTouchEvents(type, imageContainer);
    
      const firstImage = imageContainer.querySelector('.main-image');
      if (firstImage) firstImage.onload = sendHeight;
    }
    
    function setupTouchEvents(type, container) {
      let startX = 0, startY = 0;
    
      container.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });
    
      container.addEventListener('touchend', (e) => {
        const diffX = startX - e.changedTouches[0].clientX;
        const diffY = startY - e.changedTouches[0].clientY;
    
        if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
          changeImage(type, diffX > 0 ? 1 : -1);
        }
      }, { passive: true });
    }
    
    function changeImage(type, direction) {
      const slider = sliders[type];
      const total = slider.images.length;
      if (!total) return;
    
      // 나머지 연산을 활용한 간결한 인덱스 순환
      slider.currentIndex = (slider.currentIndex + direction + total) % total;
      updateSlider(type);
    }
    
    function goToImage(type, index) {
      sliders[type].currentIndex = index;
      updateSlider(type);
    }
    
    function updateSlider(type) {
      const currentIndex = sliders[type].currentIndex;
    
      // classList.toggle 활용으로 코드 축약
      document.querySelectorAll(`#${type}-image-container .main-image`).forEach((img, index) => {
        img.classList.toggle('active', index === currentIndex);
      });
    
      document.querySelectorAll(`#${type}-thumbnails .thumbnail`).forEach((thumbnail, index) => {
        const isActive = index === currentIndex;
        thumbnail.classList.toggle('active', isActive);
        if (isActive) {
          thumbnail.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
      });
    }
    
    function sendHeight() {
      window.parent.postMessage({ height: document.body.scrollHeight }, '*');
    }
    
    function initSliderData(type) {
      fetch(`https://iyusei02-lgtm.github.io/images/data/${type}.json`)
        .then(res => res.json())
        .then(imageUrls => {
          imageUrls.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
          createSlider(type, imageUrls);
        })
        .catch(error => {
          console.error(`Error loading ${type} images:`, error);
          document.querySelector(`.${type}-slider`).innerHTML = '<div class="loading">이미지를 불러오는 중 오류가 발생했습니다.</div>';
          sendHeight();
        });
    }
    
    ['virtual_illustration_width', 'virtual_illustration_length'].forEach(initSliderData);
    
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') changeImage('width', -1);
      if (e.key === 'ArrowRight') changeImage('width', 1);
    });
    
    ['resize', 'load'].forEach(event => window.addEventListener(event, sendHeight));
  </script>

</body>
</html>
