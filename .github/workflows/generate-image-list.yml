name: Generate Image List and Optimize

on:
  push:
    paths:
      - 'img/width/**'
      - 'img/height/**'
      - 'img/virtual_illustration_width/**'
      - 'img/virtual_illustration_height/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-and-generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Install ImageMagick, WebP, and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp jq
          
      - name: Optimize and convert images to WebP
        run: |
          # 가로 이미지 처리 (최대 폭 1200px)
          for DIR in "img/width" "img/virtual_illustration_width"; do
            if [ -d "$DIR" ]; then
              find "$DIR" -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.gif" \) | while read file; do
                filename="${file%.*}"
                convert "$file" -resize '1200x>' -quality 85 "${filename}_temp.png"
                cwebp -q 85 "${filename}_temp.png" -o "${filename}.webp"
                rm "${filename}_temp.png" "$file"
              done
            fi
          done
          
          # 세로 이미지 처리 (최대 높이 1600px) - length를 height로 수정
          for DIR in "img/height" "img/virtual_illustration_height"; do
            if [ -d "$DIR" ]; then
              find "$DIR" -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.gif" \) | while read file; do
                filename="${file%.*}"
                convert "$file" -resize 'x1600>' -quality 85 "${filename}_temp.png"
                cwebp -q 85 "${filename}_temp.png" -o "${filename}.webp"
                rm "${filename}_temp.png" "$file"
              done
            fi
          done
          
      - name: Generate JSON lists
        run: |
          BASE_URL="https://iyusei02-lgtm.github.io/images"
          
          mkdir -p data
          
          for DIR in "img/width" "img/height" "img/virtual_illustration_width" "img/virtual_illustration_height"; do
            JSON_NAME="data/$(basename $DIR).json"
            
            if [ -d "$DIR" ]; then
              find "$DIR" -type f -iname "*.webp" | \
              sed "s|^|${BASE_URL}/|" | \
              jq -R -s -c 'split("\n")[:-1]' > "$JSON_NAME"
            else
              echo "[]" > "$JSON_NAME"
            fi
          done
          
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Optimize images and update json in data folder [skip ci]" && git push)